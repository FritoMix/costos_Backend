# Instalar una vez:  pipx install pre-commit && pre-commit install
# Ejecutar a mano:   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest-unitarios
        name: pytest (pruebas unitarias)
        entry: pytest -q tests --ignore=tests/integration
        language: system
        pass_filenames: false
        stages: [pre-commit]
