name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: datacontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d datacontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Habilita las pruebas de tests/integration/. El fixture borra y
      # recrea el schema public de esta base desechable.
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/datacontrol_test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Pruebas (pytest)
        run: pytest tests/ -q
