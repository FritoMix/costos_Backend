name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y lint
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: datacontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d datacontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Habilita las pruebas de tests/integration/. El fixture borra y
      # recrea el schema public de esta base desechable.
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/datacontrol_test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Clientes de respaldo y cifrado
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          age --version

      - name: Lint (ruff)
        run: ruff check app tests scripts/backup_postgres.py scripts/backup_render.py

      - name: Escaneo de dependencias (pip-audit)
        run: pip-audit -r requirements.txt --strict

      - name: Pruebas con cobertura (pytest)
        run: pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=70

  imagen_respaldo:
    name: Imagen del ejecutor de respaldos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen sin secretos ni acceso a producción
        run: docker build -f deploy/backup.Dockerfile -t datacontrol-backup:test .
      - name: Verificar herramientas y usuario sin privilegios
        run: |
          docker run --rm --entrypoint sh datacontrol-backup:test -c 'test "$(id -u)" != 0 && pg_dump --version && python3 --version && age --version && rclone version'
      - name: Comprobar fallo controlado sin secretos
        run: |
          set +e
          docker run --rm datacontrol-backup:test > /tmp/backup-smoke.log 2>&1
          estado=$?
          set -e
          test "$estado" -eq 1
          grep -q "Respaldo fallido" /tmp/backup-smoke.log
