# ---------------------------------------------------------------------------
# DATACONTROL - despliegue del backend en Render (Blueprint)
#
# Para que sirve
# --------------
# Describe la base de datos y el servicio de la API, y sobre todo ENLAZA las
# dos: Render pone la cadena de conexion en DATABASE_URL por su cuenta. Asi
# nadie tiene que copiarla a mano, que es de donde salia el error
# "Name or service not known" (sin DATABASE_URL la app caia al host "db",
# que solo existe dentro de Docker Compose).
#
# Como se usa
# -----------
#   Render -> New -> Blueprint -> se elige este repositorio.
# Render lee este archivo, crea la base y el servicio, y los conecta.
#
# Al desplegar pedira los dos valores marcados como "sync: false", que son
# los que dependen de cada instalacion (ver abajo).
# ---------------------------------------------------------------------------

databases:
  - name: datacontrol-db
    databaseName: datacontrol
    user: datacontrol
    plan: free

services:
  - type: web
    name: datacontrol-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render revisa esta ruta para saber si la API esta viva.
    healthCheckPath: /api/v1/salud
    envVars:
      # La pieza clave: la cadena de conexion la pone Render sola, tomandola
      # de la base de arriba. No se escribe a mano en ningun lado.
      - key: DATABASE_URL
        fromDatabase:
          name: datacontrol-db
          property: connectionString

      # Firma las sesiones. Render genera una clave larga y aleatoria; nadie
      # (ni nosotros) necesita verla.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Contrasena del usuario "admin" que se crea la primera vez.
      # sync: false = Render la pide al desplegar y no queda escrita en el repo.
      - key: ADMIN_PASSWORD
        sync: false

      # De donde se permite consumir la API (la direccion del frontend).
      - key: CORS_ORIGINS
        sync: false

      - key: APP_ENV
        value: production

      - key: TZ
        value: America/Bogota

      # Tamano del pool de conexiones. En el plan free de Render PostgreSQL
      # limita el numero de conexiones; ajustalo si hace falta.
      - key: DATABASE_POOL_SIZE
        value: 10

      - key: DATABASE_MAX_OVERFLOW
        value: 20
